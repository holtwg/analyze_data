[project]
name = "football-odds-analysis"
version = "0.1.0"
description = "抓取 titan007 百家欧指，估算胜平负概率并给出体彩方向研判"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
]

[project.scripts]
football-odds = "src.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
